# LiteLLM proxy config: one alias per job. Apps ask for an alias, never a URL.

model_list:
  # reasoning - production: a large long-context model on a sovereign GPU cloud
  # (remote, e.g. MeluXina), so requests are pseudonymised first.
  # Kit: the local 3B model behind `tap`, which shows what a remote model receives.
  - model_name: reasoning
    litellm_params:
      model: os.environ/REASONING_MODEL         # model name on that endpoint (.env)
      custom_llm_provider: openai               # same as "openai/<model>": any OpenAI-compatible endpoint
      api_base: os.environ/REASONING_API_BASE   # <- change this (in .env) to move the route
      api_key: os.environ/REASONING_API_KEY
      tags: ["long-context"]

  # code - production: a code model on-prem behind vLLM or similar.
  - model_name: code
    litellm_params:
      model: openai/qwen2.5-coder:1.5b
      api_base: http://ollama:11434/v1
      api_key: not-needed-locally               # Ollama ignores it; the openai provider wants a value
      tags: ["code"]

  # fast - production: a small fast model on-prem, high-volume classification and extraction.
  - model_name: fast
    litellm_params:
      model: openai/qwen2.5:1.5b-instruct
      api_base: http://ollama:11434/v1
      api_key: not-needed-locally
      tags: ["classify", "extract"]

  # embed - production: an on-prem embedding model feeding a vector store.
  - model_name: embed
    litellm_params:
      model: openai/nomic-embed-text:v1.5
      api_base: http://ollama:11434/v1
      api_key: not-needed-locally

  # Try it yourself: add your own OpenAI-compatible endpoint as a fifth alias
  # (uncomment, edit, then: docker compose restart litellm).
  # - model_name: my-endpoint
  #   litellm_params:
  #     model: openai/<model-name-on-your-endpoint>
  #     api_base: https://<your-endpoint>/v1
  #     api_key: os.environ/MY_ENDPOINT_API_KEY
  #     tags: ["long-context"]

router_settings:
  enable_tag_filtering: true           # tags sent by the caller pick the matching deployment
  fallbacks: [{"reasoning": ["fast"]}] # if reasoning fails, answer with fast

# Guardrails run in the order listed here (verified on LiteLLM 1.109.1).
# tier1-pseudonymise comes first so the IBAN gets a restorable placeholder;
# filter-in then still blocks secrets and jailbreaks, and masks any IBAN-shaped
# string that Presidio did not accept as an IBAN.
guardrails:
  # Steps 1 and 5 - pseudonymise, then restore: Presidio replaces personal data
  # with placeholders; the placeholder->value map stays inside the gateway process.
  - guardrail_name: tier1-pseudonymise
    litellm_params:
      guardrail: presidio
      mode: pre_call                  # replaces personal data in the request
      default_on: true                # applies to every request
      output_parse_pii: true          # puts the real values back into the answer
      presidio_filter_scope: input    # scan the request only; the default "both" would re-mask the restored answer
      pii_entities_config:           # what Presidio looks for
        PERSON: MASK
        DATE_TIME: MASK
        EMAIL_ADDRESS: MASK
        IBAN_CODE: MASK
        PHONE_NUMBER: MASK

  # Step 2 - filter in: cheap, local checks on every request.
  - guardrail_name: filter-in
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call                  # runs on the request, before the model
      default_on: true
      patterns:
        - pattern_type: prebuilt
          pattern_name: aws_access_key
          action: BLOCK               # HTTP 400, nothing reaches a model
        - pattern_type: regex
          name: iban
          # IBAN shape: 2 letters, 2 check digits, groups of 4 with optional single spaces
          pattern: '(?-i:\b[A-Z]{2}[0-9]{2}(?: ?[A-Z0-9]{4}){2,7}(?: ?[A-Z0-9]{1,3})?\b)'
          action: MASK                # one-way: replaced by [IBAN_REDACTED]
      categories:
        - category: prompt_injection_jailbreak
          enabled: true
          action: BLOCK

litellm_settings:
  turn_off_message_logging: true      # never pass prompt or response bodies to a logger
  callbacks: trace_line.trace_line    # one JSON metadata line per call (gateway/trace_line.py), stdout only

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
